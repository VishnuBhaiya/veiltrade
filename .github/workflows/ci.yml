name: VeilTrade CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js app
        run: npm run build
      - name: Compile smart contracts
        run: npm run contracts:compile
      - name: Export HSK bootstrap artifact
        if: github.event_name == 'push'
        run: |
          mkdir -p src/generated
          cp artifacts/contracts/VeilDemoBootstrap.sol/VeilDemoBootstrap.json src/generated/VeilDemoBootstrap.json
          git config user.name "veiltrade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/generated/VeilDemoBootstrap.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate HSK bootstrap artifact [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veiltrade-contract-artifacts
          path: artifacts/contracts
          retention-days: 1
      - name: Run contract tests
        run: npm run contracts:test
